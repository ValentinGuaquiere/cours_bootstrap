<!DOCTYPE html>
<html>

    <head>
        <meta charset='utf-8'>
        <meta http-equiv='X-UA-Compatible' content='IE=edge'>
        <title>Portfolio</title>
        <meta name='viewport' content='width=device-width, initial-scale=1'>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
            crossorigin="anonymous">
    </head>

    <body>
        <header>
            <nav class="bg-light">
                <div class="container">
                    <div class="bg-secondary py-4"></div>
                </div>
            </nav>
        </header>
        <main>
            <section class="my-5">
                <div class="container">
                    <div class="row">
                        <div class="col-12 col-md-6">
                            <h1>Je suis John Doe Developpeur et
                                Designer Web</h1>
                            <h2>Bienvenue dans mon univers créatif</h2>
                            <button>Mon expertise Web</button>
                        </div>
                        <div class="col-12 col-md-6">
                            <img src="img/portrait.jpg" alt="portrait"
                                class="w-100">
                        </div>
                    </div>
                </div>
            </section>
            <section class="bg-light py-5">
                <div class="container">
                    <h2>Mon expertise</h2>
                    <h3>Développement web et design</h3>

                    <div class="row mt-5">
                        <div class="col-12 col-md-7">
                            <div class="bg-secondary py-5 h-100 w-100"></div>
                        </div>
                        <div class="col-12 col-md-4 offset-md-1">
                            <img src="img/code.jpg"
                                alt="écran montrant du code php" width="100%">
                        </div>

                    </div>
                    <div class="row mt-5">
                        <div class="col-12 col-md-4">
                            <img src="img/design.jpg"
                                alt="ecran montrant un bureau" width="100%">
                        </div>
                        <div class="col-12 col-md-7 offset-md-1">
                            <div class="bg-secondary py-5 h-100 w-100"></div>
                        </div>
                    </div>
                </div>
            </section>
            <section class="py-5">
                <div class="container">
                    <h2>Mon portfolio</h2>
                    <h3>Projet perso et pro</h3>

                    <div class="row mt-5">
                        <div class="col-3">
                            <div class="bg-secondary h-100 w-100 py-5"></div>
                        </div>
                        <div class="col-3">
                            <div class="bg-secondary h-100 w-100 py-5"></div>
                        </div>
                        <div class="col-3">
                            <div class="bg-secondary h-100 w-100 py-5"></div>
                        </div>
                        <div class="col-3">
                            <div class="bg-secondary h-100 w-100 py-5"></div>
                        </div>
                    </div>
                </div>
            </section>
            <section class="py-5 bg-light">
                <div class="container">
                    <h2>Un projet de création web ?</h2>
                    <h3>Allons en discuter autour d'un café</h3>

                    <div class="row mt-5">
                        <div class=" col-12 col-md-5">
                            <img src="img/grab-a-coffee.jpg"
                                alt="Image d'une tasse de café" width="100%">
                        </div>
                        <div class="col-12 offset-md-1 col-md-6">
                            <div class="bg-secondary h-100 w-100 py-5"></div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
        <footer class="py-5">
            <div class="container">
                <div class="row">
                    <div class="col-12 col-md-4">
                        <div class="bg-secondary py-5"></div>
                    </div>
                    <div class="col-12 col-md-4">
                        <div class="bg-secondary py-5"></div>
                    </div>
                    <div class="col-12 col-md-4">
                        <div class="bg-secondary py-5"></div>
                    </div>
                </div>
            </div>
        </footer>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
